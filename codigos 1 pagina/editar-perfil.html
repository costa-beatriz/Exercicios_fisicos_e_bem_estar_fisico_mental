      </ul>
    </nav>
    <div class="header-icones">
      <span class="sino"
        ><img src="img_rotina/notifications.svg" alt="sino notificações"
      /></span>
      <span class="avatar"
        ><a href="perfil_index.html"
          ><span id="avatarConteudo" class="avatar-icone">
            <img
              src="img_sobre-nos/icone-de-perfil-de-avatar-padrao-imagem-de-usuario-de-midia-social-icone-de-avatar-cinza-silhueta-de-perfil-em-branco-ilustracao-vetorial_561158-3485.avif"
              alt="usuario anonimo"
            /></span></a
      ></span>
    </div>
  </header>
 
  <main>
    <section class="editar-perfil">
      <h1>Editar perfil</h1>
 
      <div class="avatar-preview">
        <span id="avatarGrande" class="avatar-grande">
          <img
            src="img_sobre-nos/icone-de-perfil-de-avatar-padrao-imagem-de-usuario-de-midia-social-icone-de-avatar-cinza-silhueta-de-perfil-em-branco-ilustracao-vetorial_561158-3485.avif"
            alt="foto de perfil" />
        </span>
        <p class="dica-foto">A foto é gerada automaticamente a partir do seu nome.</p>
      </div>
 
      <form id="editarPerfilForm">
        <p class="caixa">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" required />
        </p>
 
        <p class="caixa">
          <label for="email">E-mail</label>
          <input type="email" id="email" disabled />
          <span class="dica">O e-mail não pode ser alterado por aqui.</span>
        </p>
 
        <p class="caixa">
          <label for="novaSenha">Nova senha</label>
          <input type="password" id="novaSenha" placeholder="Deixe em branco para manter a atual" />
        </p>
 
        <div class="botoes">
          <a href="index.html" class="btn-cancelar">Cancelar</a>
          <button type="submit" class="btn-salvar">Salvar alterações</button>
        </div>
      </form>
    </section>
  </main>
