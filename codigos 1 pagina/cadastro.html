<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="java.script/cadastro.js"></script>
    <link
      rel="shortcut icon"
      href="img_sobre-nos/cerebro-pensnte-pequeno.png"
      type="image/x-icon"
    />

    <title>Cadastro - Be Well</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/login_style.css" />
  </head>

  <body>
    <div class="container">
      <div class="login">
        <img src="img_progresso/logo.png" alt="logo" />

        <h2>Crie sua conta</h2>

        <p>Preencha seus dados para começar</p>

        <form id="cadastroForm">
          <input type="text" id="nome" placeholder="Seu nome" required />

          <input type="email" id="email" placeholder="Seu e-mail" required />

          <input type="password" id="senha" placeholder="Sua senha" required />

          <input
            type="password"
            id="confirmarSenha"
            placeholder="Confirme sua senha"
            required
          />

          <button type="submit">CRIAR CONTA</button>

          <a href="perfil_index.html">Já possui uma conta? Entrar</a>
        </form>
      </div>
    </div>

<script type="module" src="java.script/cadastro.js"></script>
<link rel="stylesheet" href="css/TODOS_style.css">
  </body>
</html>
