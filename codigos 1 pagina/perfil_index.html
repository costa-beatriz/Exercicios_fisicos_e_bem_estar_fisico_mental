<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="shortcut icon"
      href="img_sobre-nos/cerebro-pensnte-pequeno.png"
      type="image/x-icon"
    />

    <title>Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/login_style.css" />
    <link rel="stylesheet" href="css/reset.css" />
  </head>

  <body>
    <div class="container">
      <div class="login">
        <img src="img_progresso/logo.png" alt="logo" />

        <h2>Entre em sua conta</h2>

        <p>informe seu Email e Senha</p>

        <form id="loginForm">
          <input type="email" id="email" placeholder="Seu e-mail" required />

          <input type="password" id="senha" placeholder="Sua senha" required />

          <button type="submit">Acessar</button>

          <a href="cadastro.html" class="continuar-sem-login">Ainda não possui uma conta? Cadastre-se</a>
          <a href="index.html" class="link-sair" style="display: none">Sair da conta</a>
          <a href="index.html" class="continuar-sem-login">Continuar sem login</a>
          <a href="index.html" class="voltar-inicio" style="display: none;">Voltar à página principal</a>
        </form>
      </div>
    </div>

<script type="module" src="java.script/avatar.js"></script>
<script type="module" src="java.script/login.js"></script>
    <link rel="stylesheet" href="css/TODOS_style.css" />
  </body>
</html>
